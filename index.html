<script>
const API_BASE = "http://127.0.0.1:8000";

async function loadScreener() {
  const container = document.getElementById("screener-results");
  container.innerHTML = "<p style='color:#aaa'>Cargando screener con semáforos...</p>";

  try {
    const res = await fetch(`${API_BASE}/screener`);
    const data = await res.json();

    let html = `<p>Última actualización: ${new Date(data.last_updated).toLocaleString()}</p>`;

    Object.entries(data.watchlists).forEach(([category, items]) => {
      html += `<h3 style="margin:25px 0 10px 0; color:#ffd700;">${category}</h3><div class="grid">`;
      
      items.forEach(item => {
        const s = item.signal || {color:"red", strength:"Dormant", action:"Esperando catalizador"};
        const color = s.color === "green" ? "#22c55e" : s.color === "yellow" ? "#eab308" : "#ef4444";
        
        html += `
          <div class="card" style="border-left: 6px solid ${color}; padding:15px;">
            <h3 style="margin:0 0 8px 0; color:#fff;">${item.ticker}</h3>
            <p style="color:${color}; font-weight:bold;">${s.strength}</p>
            <p style="font-size:0.9rem; margin:5px 0;">${s.action}</p>
          </div>`;
      });
      
      html += `</div>`;
    });

    container.innerHTML = html;
  } catch (e) {
    container.innerHTML = `<p style="color:red">Error: Asegúrate que uvicorn esté corriendo.</p>`;
  }
}

async function runDCF() {
  const ticker = document.getElementById("ticker-input").value.trim().toUpperCase();
  if (!ticker) return alert("Ingresa un ticker");

  const container = document.getElementById("dcf-results");
  container.innerHTML = "<p style='color:#aaa'>Calculando DCF...</p>";

  try {
    const res = await fetch(`${API_BASE}/valuation/${ticker}/dcf`);
    const data = await res.json();
    
    container.innerHTML = `
      <h3 style="color:#ffd700;">Valuación DCF - ${ticker}</h3>
      <pre style="background:#111; padding:15px; border-radius:8px; max-height:500px; overflow:auto; color:#ddd;">${JSON.stringify(data, null, 2)}</pre>
    `;
  } catch (e) {
    container.innerHTML = `<p style="color:red">Error al calcular DCF.</p>`;
  }
}
</script>
